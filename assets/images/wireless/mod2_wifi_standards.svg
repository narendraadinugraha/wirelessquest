<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="400" fill="#0b1120"/>
  <!-- OFDMA Resource Units Grid -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
    <rect x="140" y="0" width="120" height="50" rx="8" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="2"/>
    <rect x="280" y="0" width="160" height="50" rx="8" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="70" width="200" height="50" rx="8" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="2"/>
    <rect x="220" y="70" width="220" height="50" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  </g>
  <!-- Wi-Fi 6 / 7 Center Emblem -->
  <g transform="translate(300, 290)">
    <rect x="-115" y="-32" width="230" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="0" y="6" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">IEEE 802.11ax/be</text>
    <text x="0" y="24" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">OFDMA • MU-MIMO • 1024-QAM</text>
  </g>
</svg>