<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#hero-bg)"/>

  <!-- Smooth RF Spectrum Sine Waves -->
  <path d="M 200 220 Q 350 90 500 220 T 800 220 T 1100 220 T 1400 220" fill="none" stroke="url(#wave-1)" stroke-width="4"/>
  <path d="M 250 220 Q 375 130 500 220 T 750 220 T 1000 220 T 1250 220" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.35"/>
  <path d="M 300 220 Q 400 170 500 220 T 700 220 T 900 220 T 1100 220" fill="none" stroke="#10b981" stroke-width="2" opacity="0.45"/>

  <!-- Right Side Enterprise Wi-Fi 6 Access Point & Signal Rings -->
  <g transform="translate(960, 195)">
    <circle cx="0" cy="0" r="145" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="10 8" opacity="0.35"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="16 10" opacity="0.5"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.6"/>
    <!-- AP Hardware Icon -->
    <rect x="-36" y="-36" width="72" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#0f172a"/>
    <path d="M -8 2 Q 0 -6 8 2 M -4 6 Q 0 2 4 6" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="1.8" fill="#34d399"/>
  </g>
</svg>