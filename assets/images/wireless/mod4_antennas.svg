<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="400" fill="#090f1d"/>
  <!-- Outdoor Tower Mast -->
  <polygon points="150,350 185,120 215,120 250,350" fill="none" stroke="#475569" stroke-width="3"/>
  <line x1="165" y1="260" x2="235" y2="260" stroke="#475569" stroke-width="2.5"/>
  <line x1="175" y1="190" x2="225" y2="190" stroke="#475569" stroke-width="2.5"/>
  <!-- Parabolic Dish Antenna -->
  <path d="M 215 100 Q 255 135 215 170" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="135" x2="265" y2="135" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="265" cy="135" r="5" fill="#34d399"/>
  <!-- Directional Beam Waves -->
  <g fill="none" stroke="#34d399" stroke-linecap="round">
    <path d="M 295 110 Q 320 135 295 160" stroke-width="3" opacity="0.85"/>
    <path d="M 330 95 Q 365 135 330 175" stroke-width="2.5" opacity="0.65"/>
    <path d="M 370 80 Q 415 135 370 190" stroke-width="2" opacity="0.45"/>
    <path d="M 415 65 Q 470 135 415 205" stroke-width="1.5" opacity="0.25"/>
  </g>
  <!-- Fresnel Ellipse -->
  <ellipse cx="395" cy="135" rx="135" ry="42" fill="#06b6d4" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="395" y="215" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">FRESNEL ZONE • 24 dBi DISH</text>
</svg>