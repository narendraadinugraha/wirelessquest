<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="400" fill="#090e1a"/>
  <!-- Extended Service Set (ESS) Dual BSS Zones -->
  <circle cx="195" cy="185" r="115" fill="#4f46e5" fill-opacity="0.16" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="405" cy="185" r="115" fill="#06b6d4" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- AP-1 -->
  <g transform="translate(195, 165)">
    <rect x="-22" y="-12" width="44" height="24" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <line x1="-12" y1="-12" x2="-15" y2="-28" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="15" y2="-28" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="30" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BSS-1 (AP-1)</text>
  </g>

  <!-- AP-2 -->
  <g transform="translate(405, 165)">
    <rect x="-22" y="-12" width="44" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-12" y1="-12" x2="-15" y2="-28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="15" y2="-28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BSS-2 (AP-2)</text>
  </g>

  <!-- Roaming Client Moving Between AP-1 and AP-2 -->
  <g transform="translate(300, 225)">
    <rect x="-18" y="-12" width="36" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <path d="M -22 12 L 22 12 L 18 17 L -18 17 Z" fill="#34d399"/>
    <text x="0" y="34" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">802.11r ROAMING</text>
  </g>

  <!-- Distribution System Switch -->
  <rect x="220" y="325" width="160" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="300" y="345" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">ESS DISTRIBUTION SWITCH</text>
  <path d="M 195 190 L 195 341 L 220 341" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M 405 190 L 405 341 L 380 341" fill="none" stroke="#38bdf8" stroke-width="2"/>
</svg>