<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="bssGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="essGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 03</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Topologi WLAN &amp; Arsitektur Service Set (BSS, ESS, Mesh &amp; WLC)</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Konsep arsitektur BSSID, ESSID terdistribusi, mekanisme seamless roaming (802.11k/v/r), dan kontroler WLC terpusat.</text>
  </g>

  <!-- Left Side: BSS vs IBSS vs ESS Visual Architecture -->
  <g transform="translate(30, 78)">
    <!-- Section 1: BSS (Basic Service Set) -->
    <g transform="translate(0, 0)">
      <rect width="380" height="155" rx="10" fill="url(#bssGrad)" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">1. BSS (Basic Service Set) — Topologi Infrastruktur</text>
      
      <!-- AP in Center with Radio Waves -->
      <circle cx="100" cy="85" r="45" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-dasharray="3 3"/>
      <circle cx="100" cy="85" r="28" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <circle cx="100" cy="85" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="100" y="89" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">📡</text>
      <text x="100" y="118" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Access Point</text>
      <text x="100" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">BSSID: MAC AP</text>

      <!-- Connected Clients -->
      <g transform="translate(190, 48)" font-family="'Inter', sans-serif" font-size="10">
        <text x="0" y="15" fill="#e2e8f0">📱 Smartphone (Station)</text>
        <text x="0" y="35" fill="#e2e8f0">💻 Laptop Mahasiswa</text>
        <text x="0" y="55" fill="#e2e8f0">📠 Wireless IoT Device</text>
        <text x="0" y="80" fill="#38bdf8" font-size="9.5" font-family="'JetBrains Mono', monospace">Karakteristik: 1 AP + Klien Asosiasi</text>
        <text x="0" y="93" fill="#94a3b8" font-size="8.5">Seluruh trafik wajib melalui Access Point</text>
      </g>
    </g>

    <!-- Section 2: IBSS (Ad-Hoc / P2P) -->
    <g transform="translate(0, 170)">
      <rect width="380" height="155" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">2. IBSS (Independent BSS) — Mode Ad-Hoc / P2P</text>

      <!-- P2P Connected Clients -->
      <g transform="translate(40, 50)">
        <circle cx="40" cy="40" r="18" fill="#1e293b" stroke="#94a3b8"/>
        <text x="40" y="44" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">💻</text>
        <text x="40" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">STA-A</text>

        <path d="M 65 40 L 135 40" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="100" y="32" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Wi-Fi Direct</text>

        <circle cx="160" cy="40" r="18" fill="#1e293b" stroke="#94a3b8"/>
        <text x="160" y="44" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">💻</text>
        <text x="160" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">STA-B</text>
      </g>

      <g transform="translate(240, 52)" font-family="'Inter', sans-serif" font-size="10">
        <text x="0" y="15" fill="#f59e0b" font-weight="700">Tanpa Access Point!</text>
        <text x="0" y="32" fill="#cbd5e1">Komunikasi peer-to-peer</text>
        <text x="0" y="48" fill="#94a3b8" font-size="9.5">Contoh: Apple AirDrop, Miracast,</text>
        <text x="0" y="62" fill="#94a3b8" font-size="9.5">transfer file nirkabel langsung.</text>
      </g>
    </g>
  </g>

  <!-- Right Side: ESS (Extended Service Set) with Seamless Roaming -->
  <g transform="translate(430, 78)">
    <rect width="380" height="325" rx="10" fill="url(#essGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">3. ESS (Extended Service Set) &amp; Enterprise Roaming</text>
    <text x="16" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Gabungan multi-AP dengan satu nama SSID yang sama di gedung kampus/sekolah.</text>

    <!-- Diagram of 2 APs connected via Distribution System (Switch/DS) -->
    <g transform="translate(20, 58)">
      <!-- Central Switch / WLC -->
      <rect x="110" y="10" width="120" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="170" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">WLC / Switch DS</text>
      <text x="170" y="36" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">CAPWAP Tunnel</text>

      <!-- Trunk lines to AP 1 and AP 2 -->
      <path d="M 130 42 L 60 85" stroke="#10b981" stroke-width="1.5"/>
      <path d="M 210 42 L 280 85" stroke="#10b981" stroke-width="1.5"/>

      <!-- AP 1 (Ruang Kelas A) -->
      <g transform="translate(25, 85)">
        <circle cx="35" cy="35" r="32" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-dasharray="2 2"/>
        <circle cx="35" cy="35" r="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
        <text x="35" y="39" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">📡</text>
        <text x="35" y="78" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AP-01 (Kanal 1)</text>
        <text x="35" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SSID: "SMK-WIFI"</text>
      </g>

      <!-- Seamless Roaming Arrow in the middle -->
      <g transform="translate(145, 110)">
        <path d="M 10 15 Q 25 5 40 15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
        <polygon points="42,15 36,10 38,17" fill="#38bdf8"/>
        <text x="25" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">ROAMING</text>
        <text x="25" y="40" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">&lt; 50ms (802.11r)</text>
      </g>

      <!-- AP 2 (Ruang Lab B) -->
      <g transform="translate(245, 85)">
        <circle cx="35" cy="35" r="32" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-dasharray="2 2"/>
        <circle cx="35" cy="35" r="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
        <text x="35" y="39" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">📡</text>
        <text x="35" y="78" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AP-02 (Kanal 6)</text>
        <text x="35" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">SSID: "SMK-WIFI"</text>
      </g>
    </g>

    <!-- Key Takeaway Banner -->
    <g transform="translate(16, 255)">
      <rect width="348" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Keunggulan Arsitektur ESS:</text>
      <text x="12" y="32" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9">Klien berpindah antar-ruangan tanpa putus koneksi (Fast BSS Transition).</text>
      <text x="12" y="45" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Kanal AP diatur berbeda (Ch 1 &amp; Ch 6) untuk cegah Co-Channel Interference.</text>
    </g>
  </g>
</svg>
