<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="dirGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="50" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 04</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Karakteristik Antena Nirkabel, Penguatan Gain (dBi) &amp; Pola Radiasi RF</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Perbandingan pola pancaran 360° Omnidirectional vs Directional terarah (Patch, Yagi, Parabolic) dan kalkulasi link budget.</text>
  </g>

  <!-- Side-by-side comparison: Omnidirectional vs Directional -->
  <!-- Left Card: Omnidirectional Antenna -->
  <g transform="translate(30, 78)">
    <rect width="380" height="328" rx="12" fill="url(#omniGrad)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#06b6d4" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🗼</text>
    <text x="56" y="28" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">Antena Omnidirectional</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Pancaran Horizontal 360° Merata (Bentuk Donut)</text>

    <!-- Radiation Pattern Graphic: 360 Donut Toroid -->
    <g transform="translate(60, 65)">
      <!-- Azimuth plane (top view) -->
      <circle cx="65" cy="55" r="42" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="65" cy="55" r="26" fill="#06b6d4" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="65" cy="55" r="6" fill="#ffffff" filter="url(#glow)"/>
      <text x="65" y="112" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Azimuth (360°)</text>

      <!-- Elevation plane (side view - toroid donut) -->
      <g transform="translate(140, 15)">
        <ellipse cx="60" cy="40" rx="48" ry="18" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5"/>
        <line x1="60" y1="12" x2="60" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="60" y="97" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Elevation (Tegak)</text>
      </g>
    </g>

    <!-- Specs List -->
    <g transform="translate(16, 195)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="348" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="14" fill="#cbd5e1" font-weight="600">Tipikal Penguatan Gain:</text>
      <text x="10" y="25" fill="#22d3ee" font-family="'JetBrains Mono', monospace">2 dBi s/d 9 dBi (Semakin tinggi gain, semakin pipih donat)</text>

      <g transform="translate(0, 36)">
        <rect width="348" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="10" y="14" fill="#cbd5e1" font-weight="600">Jangkauan Area:</text>
        <text x="10" y="25" fill="#e2e8f0">Poin-to-Multipoint (PtMP), dalam ruangan kelas, kantor, rumah</text>
      </g>

      <g transform="translate(0, 72)">
        <rect width="348" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="10" y="15" fill="#cbd5e1" font-weight="600">Kelebihan &amp; Penggunaan:</text>
        <text x="10" y="28" fill="#94a3b8" font-size="9.5">Klien di segala arah dapat terkoneksi tanpa perlu mengarahkan sudut antena.</text>
        <text x="10" y="40" fill="#22d3ee" font-size="9">Standar bawaan Access Point indoor &amp; router rumahan.</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Directional Antenna -->
  <g transform="translate(430, 78)">
    <rect width="380" height="328" rx="12" fill="url(#dirGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#f59e0b" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🎯</text>
    <text x="56" y="28" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">Antena Directional (Terarah)</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Pancaran Sempit Terfokus (Sektor, Yagi, Dish Grid)</text>

    <!-- Radiation Pattern Graphic: Focused Beam Conical Lobe -->
    <g transform="translate(50, 65)">
      <!-- Main Lobe Beam -->
      <path d="M 50 50 Q 150 15 220 50 Q 150 85 50 50 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
      <!-- Back Lobe (Minor) -->
      <ellipse cx="35" cy="50" rx="15" ry="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-dasharray="2 2"/>
      <!-- Antenna Source -->
      <rect x="42" y="40" width="16" height="20" rx="3" fill="#ffffff" filter="url(#glow)"/>
      <text x="50" y="75" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Feedhorn</text>

      <text x="160" y="54" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">Main Lobe (Beam)</text>
      <text x="160" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8.5">Sudut Pancar Sempit (15° - 60°)</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(16, 195)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="348" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="14" fill="#cbd5e1" font-weight="600">Tipikal Penguatan Gain:</text>
      <text x="10" y="25" fill="#fbbf24" font-family="'JetBrains Mono', monospace">12 dBi s/d 34 dBi (Jarak Tembus Hingga Puluhan Kilometer)</text>

      <g transform="translate(0, 36)">
        <rect width="348" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="10" y="14" fill="#cbd5e1" font-weight="600">Model Topologi:</text>
        <text x="10" y="25" fill="#e2e8f0">Point-to-Point (PtP) nirkabel antar-gedung kampus atau ISP tower</text>
      </g>

      <g transform="translate(0, 72)">
        <rect width="348" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="10" y="15" fill="#cbd5e1" font-weight="600">Kelebihan &amp; Tipe Populer:</text>
        <text x="10" y="28" fill="#94a3b8" font-size="9.5">Tahan interferensi samping, sinyal sangat padat dan fokus.</text>
        <text x="10" y="40" fill="#fbbf24" font-size="9">Tipe: Antena Sektoral, Yagi, Flat Patch, Parabolic Dish.</text>
      </g>
    </g>
  </g>
</svg>
