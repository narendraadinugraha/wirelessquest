<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="50" y="15" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 02</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Standar Protokol IEEE 802.11 &amp; Evolusi Generasi Wi-Fi</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roadmap evolusi kecepatan fisik (PHY Rate), modulasi QAM, efisiensi spektrum OFDMA, dan teknologi multi-antena MU-MIMO.</text>
  </g>

  <!-- Timeline Cards: Wi-Fi 4, Wi-Fi 5, Wi-Fi 6/6E, Wi-Fi 7 -->
  <!-- Generation 1: Wi-Fi 4 (802.11n) -->
  <g transform="translate(30, 78)">
    <rect width="180" height="328" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="12" y="12" width="156" height="30" rx="6" fill="#1e3a8a" fill-opacity="0.4"/>
    <text x="90" y="32" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">Wi-Fi 4 (802.11n)</text>
    <text x="90" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Rilis: 2009 • Dual-Band</text>

    <!-- Speed Gauge -->
    <rect x="16" y="74" width="148" height="44" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="24" y="92" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Throughput Maks:</text>
    <text x="24" y="108" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">600 Mbps</text>

    <g transform="translate(16, 130)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="15" fill="#cbd5e1" font-weight="600">Pita Frekuensi:</text>
      <text x="0" y="28" fill="#93c5fd" font-family="'JetBrains Mono', monospace">2.4 GHz &amp; 5 GHz</text>

      <text x="0" y="50" fill="#cbd5e1" font-weight="600">Modulasi:</text>
      <text x="0" y="63" fill="#94a3b8">64-QAM (6 bit/simbol)</text>

      <text x="0" y="85" fill="#cbd5e1" font-weight="600">Lebar Kanal:</text>
      <text x="0" y="98" fill="#94a3b8">20 MHz &amp; 40 MHz</text>

      <text x="0" y="120" fill="#cbd5e1" font-weight="600">Teknologi Kunci:</text>
      <text x="0" y="133" fill="#e2e8f0">MIMO 4x4 Antena</text>
      <text x="0" y="146" fill="#64748b" font-size="9">Frame Aggregation (A-MPDU)</text>
    </g>
  </g>

  <!-- Generation 2: Wi-Fi 5 (802.11ac) -->
  <g transform="translate(225, 78)">
    <rect width="180" height="328" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="12" y="12" width="156" height="30" rx="6" fill="#4c1d95" fill-opacity="0.4"/>
    <text x="90" y="32" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">Wi-Fi 5 (802.11ac)</text>
    <text x="90" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Rilis: 2013 • Wave 1 &amp; 2</text>

    <rect x="16" y="74" width="148" height="44" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="24" y="92" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Throughput Maks:</text>
    <text x="24" y="108" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">3.46 Gbps</text>

    <g transform="translate(16, 130)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="15" fill="#cbd5e1" font-weight="600">Pita Frekuensi:</text>
      <text x="0" y="28" fill="#c4b5fd" font-family="'JetBrains Mono', monospace">Hanya 5 GHz Eksklusif</text>

      <text x="0" y="50" fill="#cbd5e1" font-weight="600">Modulasi:</text>
      <text x="0" y="63" fill="#94a3b8">256-QAM (8 bit/simbol)</text>

      <text x="0" y="85" fill="#cbd5e1" font-weight="600">Lebar Kanal:</text>
      <text x="0" y="98" fill="#94a3b8">80 MHz &amp; 160 MHz</text>

      <text x="0" y="120" fill="#cbd5e1" font-weight="600">Teknologi Kunci:</text>
      <text x="0" y="133" fill="#e2e8f0">MU-MIMO Downlink</text>
      <text x="0" y="146" fill="#64748b" font-size="9">Beamforming Transmisi</text>
    </g>
  </g>

  <!-- Generation 3: Wi-Fi 6 / 6E (802.11ax) -->
  <g transform="translate(420, 78)">
    <rect width="190" height="328" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
    <rect x="12" y="12" width="166" height="30" rx="6" fill="#064e3b" fill-opacity="0.4"/>
    <text x="95" y="32" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">Wi-Fi 6 (802.11ax)</text>
    <text x="95" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Rilis: 2019/2021 • High Efficiency</text>

    <rect x="16" y="74" width="158" height="44" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="24" y="92" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Throughput Maks:</text>
    <text x="24" y="108" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">9.6 Gbps</text>

    <g transform="translate(16, 130)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="15" fill="#cbd5e1" font-weight="600">Pita Frekuensi:</text>
      <text x="0" y="28" fill="#6ee7b7" font-family="'JetBrains Mono', monospace">2.4 / 5 / 6 GHz (Wi-Fi 6E)</text>

      <text x="0" y="50" fill="#cbd5e1" font-weight="600">Modulasi:</text>
      <text x="0" y="63" fill="#94a3b8">1024-QAM (10 bit/simbol)</text>

      <text x="0" y="85" fill="#cbd5e1" font-weight="600">Efisiensi Kanal:</text>
      <text x="0" y="98" fill="#34d399" font-weight="700">OFDMA (Multi-User Subcarrier)</text>

      <text x="0" y="120" fill="#cbd5e1" font-weight="600">Teknologi Kunci:</text>
      <text x="0" y="133" fill="#e2e8f0">MU-MIMO UL &amp; DL 8x8</text>
      <text x="0" y="146" fill="#64748b" font-size="9">Target Wake Time (TWT IoT)</text>
    </g>
  </g>

  <!-- Generation 4: Wi-Fi 7 (802.11be) -->
  <g transform="translate(625, 78)">
    <rect width="185" height="328" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="12" y="12" width="161" height="30" rx="6" fill="#78350f" fill-opacity="0.4"/>
    <text x="92" y="32" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">Wi-Fi 7 (802.11be)</text>
    <text x="92" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Rilis: 2024 • Extremely High</text>

    <rect x="16" y="74" width="153" height="44" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="24" y="92" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Throughput Maks:</text>
    <text x="24" y="108" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">46 Gbps</text>

    <g transform="translate(16, 130)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="15" fill="#cbd5e1" font-weight="600">Pita Frekuensi:</text>
      <text x="0" y="28" fill="#fde68a" font-family="'JetBrains Mono', monospace">Tri-Band Simultan (MLO)</text>

      <text x="0" y="50" fill="#cbd5e1" font-weight="600">Modulasi:</text>
      <text x="0" y="63" fill="#94a3b8">4096-QAM (12 bit/simbol)</text>

      <text x="0" y="85" fill="#cbd5e1" font-weight="600">Lebar Kanal:</text>
      <text x="0" y="98" fill="#94a3b8">Super Lebar 320 MHz</text>

      <text x="0" y="120" fill="#cbd5e1" font-weight="600">Teknologi Kunci:</text>
      <text x="0" y="133" fill="#e2e8f0">Multi-Link Operation (MLO)</text>
      <text x="0" y="146" fill="#64748b" font-size="9">Latensi Ultra Rendah &lt; 2ms</text>
    </g>
  </g>
</svg>
