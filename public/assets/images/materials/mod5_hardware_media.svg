<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="wpa2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wpa3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="entGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
    <text x="50" y="15" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 05</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Protokol Keamanan WLAN: WPA2-PSK vs WPA3 SAE &amp; 802.1X Enterprise</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Perbandingan ketahanan enkripsi 192-bit, mitigasi serangan offline dictionary brute-force, dan otentikasi server RADIUS.</text>
  </g>

  <!-- 3 Security Architecture Cards -->
  <!-- Card 1: WPA2-Personal (Legacy PSK) -->
  <g transform="translate(30, 78)">
    <rect width="245" height="328" rx="12" fill="url(#wpa2Grad)" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#f43f5e" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#fb7185" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⚠️</text>
    <text x="56" y="28" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">WPA2-Personal</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Standar 2004 • Pre-Shared Key (PSK)</text>

    <!-- Handshake Graphic: 4-Way Handshake with vulnerability icon -->
    <g transform="translate(20, 60)">
      <rect width="205" height="52" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="12" y="20" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">4-Way Handshake (EAPOL)</text>
      <text x="12" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Tukar Nonce (ANonce / SNonce)</text>
      <text x="12" y="45" fill="#fb7185" font-family="'Inter', sans-serif" font-size="8">Rentan Deauthentication &amp; Capture</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Enkripsi Data:</text>
      <text x="10" y="26" fill="#cbd5e1">AES-CCMP (Kunci 128-bit)</text>

      <g transform="translate(0, 38)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Kelemahan Kritis:</text>
        <text x="10" y="26" fill="#fb7185" font-weight="700">Offline Dictionary Attack (Hashcat)</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Forward Secrecy:</text>
        <text x="10" y="26" fill="#f43f5e">Tidak ada (Trafik lama bisa didekripsi)</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="217" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Status Keamanan:</text>
        <text x="10" y="28" fill="#fb7185" font-size="9.5">Usang (Rentan KRACK Attack)</text>
        <text x="10" y="40" fill="#94a3b8" font-size="9">Wajib diganti untuk jaringan modern.</text>
      </g>
    </g>
  </g>

  <!-- Card 2: WPA3-Personal (SAE Dragonfly) -->
  <g transform="translate(295, 78)">
    <rect width="245" height="328" rx="12" fill="url(#wpa3Grad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#34d399" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🛡️</text>
    <text x="56" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">WPA3-Personal</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Standar Wi-Fi 6 • SAE (Simultaneous Auth)</text>

    <!-- Handshake Graphic: Dragonfly Handshake -->
    <g transform="translate(20, 60)">
      <rect width="205" height="52" rx="6" fill="#0f172a" stroke="#065f46"/>
      <text x="12" y="20" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Dragonfly Handshake (SAE)</text>
      <text x="12" y="34" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="8.5">Zero-Knowledge Proof Exchange</text>
      <text x="12" y="45" fill="#34d399" font-family="'Inter', sans-serif" font-size="8">Kebal Terhadap Offline Wordlist</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Enkripsi Data:</text>
      <text x="10" y="26" fill="#34d399">GCMP-256 (Kunci 256-bit Sangat Kuat)</text>

      <g transform="translate(0, 38)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Proteksi Brute-Force:</text>
        <text x="10" y="26" fill="#34d399" font-weight="700">Otomatis Terblokir saat Salah Tebak</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Forward Secrecy:</text>
        <text x="10" y="26" fill="#34d399">Ya (Kunci sesi baru tiap koneksi)</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="217" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Fitur Tambahan:</text>
        <text x="10" y="28" fill="#e2e8f0" font-size="9.5">Protected Management Frames (PMF)</text>
        <text x="10" y="40" fill="#34d399" font-size="9">Anti-Spoofing Deauth frame hacker.</text>
      </g>
    </g>
  </g>

  <!-- Card 3: WPA2/WPA3-Enterprise (802.1X RADIUS) -->
  <g transform="translate(560, 78)">
    <rect width="250" height="328" rx="12" fill="url(#entGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#3b82f6" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏢</text>
    <text x="56" y="28" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">WPA-Enterprise</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Standar Kampus / Kantor • IEEE 802.1X</text>

    <!-- Handshake Graphic: EAP & RADIUS Server -->
    <g transform="translate(20, 60)">
      <rect width="210" height="52" rx="6" fill="#0f172a" stroke="#1e3a8a"/>
      <text x="12" y="20" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">RADIUS / EAP-TLS Authentication</text>
      <text x="12" y="34" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="8.5">Username + Password / Sertifikat Digital</text>
      <text x="12" y="45" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="8">Tanpa Password Bersama (Individual)</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Mode Suite Keamanan:</text>
      <text x="10" y="26" fill="#60a5fa">192-bit Security Mode (CNSA Suite)</text>

      <g transform="translate(0, 38)">
        <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Manajemen Identitas:</text>
        <text x="10" y="26" fill="#38bdf8">Tersinkronisasi LDAP / Active Directory</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Dynamic VLAN:</text>
        <text x="10" y="26" fill="#34d399">Isolasi siswa vs guru dalam 1 SSID</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="222" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Penggunaan:</text>
        <text x="10" y="28" fill="#e2e8f0" font-size="9.5">Wi-Fi Universitas, Perbankan, Korporat</text>
        <text x="10" y="40" fill="#60a5fa" font-size="9">Standar tertinggi keamanan nirkabel.</text>
      </g>
    </g>
  </g>
</svg>
