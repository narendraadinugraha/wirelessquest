<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1f33"/>
    </linearGradient>
    <radialGradient id="rf-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ap-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background & Engineering Grid -->
  <rect width="1200" height="720" fill="url(#bg-grad)"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.6"/>
  <circle cx="600" cy="300" r="460" fill="url(#rf-glow)"/>

  <!-- Concentric RF Signal Waves (2.4 GHz, 5 GHz, 6 GHz) -->
  <g fill="none" stroke-linecap="round">
    <circle cx="600" cy="290" r="130" stroke="#10b981" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.7"/>
    <circle cx="600" cy="290" r="200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="22 14" opacity="0.55"/>
    <circle cx="600" cy="290" r="275" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="30 18" opacity="0.4"/>
    <circle cx="600" cy="290" r="355" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="10 18" opacity="0.3"/>
  </g>

  <!-- Directional Wireless Beams to Endpoints -->
  <g stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" opacity="0.65">
    <line x1="600" y1="290" x2="260" y2="190"/>
    <line x1="600" y1="290" x2="940" y2="190"/>
    <line x1="600" y1="290" x2="290" y2="450"/>
    <line x1="600" y1="290" x2="910" y2="440"/>
  </g>

  <!-- Central Enterprise Wi-Fi 6E/7 Access Point -->
  <g transform="translate(600, 290)" filter="url(#glow)">
    <!-- Outer shadow disc -->
    <ellipse cx="0" cy="14" rx="88" ry="88" fill="#020617" opacity="0.6"/>
    <!-- AP Chassis -->
    <rect x="-78" y="-78" width="156" height="156" rx="34" fill="url(#ap-body)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-62" y="-62" width="124" height="124" rx="24" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Glowing Status Ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#10b981" stroke-width="5"/>
    <circle cx="0" cy="0" r="22" fill="#0f172a"/>
    <!-- Wi-Fi Icon Inside Core -->
    <path d="M -10 2 Q 0 -8 10 2 M -6 7 Q 0 1 6 7" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="11" r="2.2" fill="#34d399"/>
  </g>

  <!-- Endpoint 1: Laptop Client (Top Left) -->
  <g transform="translate(260, 190)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
    <rect x="-18" y="-14" width="36" height="22" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <path d="M -24 10 L 24 10 L 20 16 L -20 16 Z" fill="#38bdf8"/>
    <text x="0" y="32" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">5 GHz • -48 dBm</text>
  </g>

  <!-- Endpoint 2: Secondary Mesh AP (Top Right) -->
  <g transform="translate(940, 190)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.9"/>
    <rect x="-16" y="-8" width="32" height="16" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
    <line x1="-10" y1="-8" x2="-13" y2="-22" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="10" y1="-8" x2="13" y2="-22" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <text x="0" y="32" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">MESH AP-02</text>
  </g>

  <!-- Endpoint 3: Smartphone / IoT Client (Bottom Left) -->
  <g transform="translate(290, 450)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#818cf8" stroke-width="2" opacity="0.9"/>
    <rect x="-10" y="-16" width="20" height="32" rx="4" fill="#1e293b" stroke="#a5b4fc" stroke-width="1.8"/>
    <circle cx="0" cy="11" r="1.8" fill="#a5b4fc"/>
    <text x="0" y="32" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Wi-Fi 6E Client</text>
  </g>

  <!-- Endpoint 4: Outdoor Directional Antenna (Bottom Right) -->
  <g transform="translate(910, 440)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#06b6d4" stroke-width="2" opacity="0.9"/>
    <path d="M -14 -12 Q 8 -14 14 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="13" cy="-13" r="3" fill="#34d399"/>
    <text x="0" y="32" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">PtP 24 dBi</text>
  </g>

  <!-- Bottom RF Spectrum Waveform Overlay -->
  <path d="M 0 640 Q 150 580 300 640 T 600 640 T 900 640 T 1200 640" fill="none" stroke="#10b981" stroke-width="2" opacity="0.35"/>
  <path d="M 0 660 Q 120 610 240 660 T 480 660 T 720 660 T 960 660 T 1200 660" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
</svg>