<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="rf24Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="rf5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="rf6Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 01</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Spektrum Frekuensi Radio (RF) &amp; Perambatan Gelombang Nirkabel</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Analisis perbandingan panjang gelombang, daya tembus dinding beton, bandwidth kanal, dan metrik daya sinyal (dBm).</text>
  </g>

  <!-- 3 Spectrum Cards -->
  <!-- Card 1: 2.4 GHz ISM -->
  <g transform="translate(30, 78)">
    <rect width="245" height="328" rx="12" fill="url(#rf24Grad)" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📡</text>
    <text x="56" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">2.4 GHz Band</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Pita Spektrum ISM (2.400 - 2.4835 GHz)</text>

    <!-- Wave Graphic: Long wavelength -->
    <path d="M 20 85 Q 50 65, 80 85 T 140 85 T 200 85 T 230 85" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <text x="122" y="112" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Panjang Gelombang λ ≈ 12.5 cm</text>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Daya Tembus Fisik:</text>
      <text x="10" y="26" fill="#34d399">Sangat Tinggi (Tembus Dinding/Bata)</text>

      <g transform="translate(0, 38)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Kanal Bebas Tumpang-Tindih:</text>
        <text x="10" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace">Hanya 3 Kanal (Ch 1, 6, 11)</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Throughput Maksimum:</text>
        <text x="10" y="26" fill="#f59e0b">Hingga 300 - 600 Mbps (Wi-Fi 4/6)</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="217" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Polusi &amp; Interferensi:</text>
        <text x="10" y="28" fill="#f43f5e" font-size="9.5">Sangat Ramai (Bluetooth, Microwave, CCTV)</text>
        <text x="10" y="40" fill="#94a3b8" font-size="9">Rekomendasi: Perangkat IoT &amp; Jarak Jauh</text>
      </g>
    </g>
  </g>

  <!-- Card 2: 5 GHz UNII -->
  <g transform="translate(295, 78)">
    <rect width="245" height="328" rx="12" fill="url(#rf5Grad)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="56" y="28" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">5 GHz Band</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Pita UNII-1 s/d UNII-3 (5.150 - 5.850 GHz)</text>

    <!-- Wave Graphic: Medium wavelength -->
    <path d="M 20 85 Q 35 65, 50 85 T 80 85 T 110 85 T 140 85 T 170 85 T 200 85 T 230 85" fill="none" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow)"/>
    <text x="122" y="112" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Panjang Gelombang λ ≈ 6.0 cm</text>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Daya Tembus Fisik:</text>
      <text x="10" y="26" fill="#f59e0b">Sedang (Teredam Kuat oleh Beton/Kaca)</text>

      <g transform="translate(0, 38)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Kanal Bebas Tumpang-Tindih:</text>
        <text x="10" y="26" fill="#a78bfa" font-family="'JetBrains Mono', monospace">Hingga 25 Kanal (20/40/80/160 MHz)</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="217" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Throughput Maksimum:</text>
        <text x="10" y="26" fill="#38bdf8">1.3 Gbps s/d 4.8 Gbps (Wi-Fi 5 &amp; 6)</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="217" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Polusi &amp; Interferensi:</text>
        <text x="10" y="28" fill="#34d399" font-size="9.5">Rendah s/d Sedang (Tersedia Fitur DFS)</text>
        <text x="10" y="40" fill="#94a3b8" font-size="9">Rekomendasi: Ruang Kelas, Lab &amp; Streaming</text>
      </g>
    </g>
  </g>

  <!-- Card 3: 6 GHz Wi-Fi 6E / Wi-Fi 7 -->
  <g transform="translate(560, 78)">
    <rect width="250" height="328" rx="12" fill="url(#rf6Grad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.25"/>
    <text x="31" y="37" fill="#34d399" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🚀</text>
    <text x="56" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">6 GHz Band</text>
    <text x="56" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Wi-Fi 6E &amp; Wi-Fi 7 (5.925 - 7.125 GHz)</text>

    <!-- Wave Graphic: High frequency dense wavelength -->
    <path d="M 20 85 Q 28 65, 36 85 T 52 85 T 68 85 T 84 85 T 100 85 T 116 85 T 132 85 T 148 85 T 164 85 T 180 85 T 196 85 T 212 85 T 228 85 T 240 85" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
    <text x="125" y="112" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Panjang Gelombang λ ≈ 4.5 cm (Super Cepat)</text>

    <!-- Specs List -->
    <g transform="translate(14, 125)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="15" fill="#e2e8f0" font-weight="600">Daya Tembus Fisik:</text>
      <text x="10" y="26" fill="#f43f5e">Rendah (Line of Sight / Dalam Ruangan)</text>

      <g transform="translate(0, 38)">
        <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Lebar Kanal Spektrum:</text>
        <text x="10" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace">1200 MHz Spektrum Baru (s/d 320 MHz)</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="222" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Throughput Maksimum:</text>
        <text x="10" y="26" fill="#38bdf8">Hingga 9.6 Gbps s/d 46 Gbps</text>
      </g>

      <g transform="translate(0, 114)">
        <rect width="222" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#e2e8f0" font-weight="600">Polusi &amp; Interferensi:</text>
        <text x="10" y="28" fill="#34d399" font-size="9.5">Nol (Bebas dari perangkat lama / Legacy-free)</text>
        <text x="10" y="40" fill="#94a3b8" font-size="9">Rekomendasi: VR Lab, High-Density &amp; AR</text>
      </g>
    </g>
  </g>
</svg>
